<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111b2d">
  <meta name="description" content="AutoFlow: gestión de clientes, vehículos y reservas de alquiler.">
  <title>AutoFlow · Gestión de alquileres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-symbol" aria-hidden="true">A<span></span></div>
        <div><div class="brand-name">Auto<span>Flow</span></div><div class="brand-subtitle">RENTAL MANAGEMENT</div></div>
      </div>
      <div class="side-caption">MENÚ PRINCIPAL</div>
      <nav class="nav" id="nav">
        <button class="nav-item active" type="button" data-page="dashboard" aria-current="page"><span class="nav-icon" data-icon="grid"></span>Dashboard</button>
        <button class="nav-item" type="button" data-page="vehiculos"><span class="nav-icon" data-icon="car"></span>Vehículos</button>
        <button class="nav-item" type="button" data-page="clientes"><span class="nav-icon" data-icon="users"></span>Clientes</button>
        <button class="nav-item" type="button" data-page="reservas"><span class="nav-icon" data-icon="calendar"></span>Reservas</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mini-head">ENTORNO DE DESARROLLO</div>
        <div class="service"><span id="side-status-dot" class="online-dot loading"></span><div><strong id="side-status-text">Conectando...</strong><small>Spring Boot + PostgreSQL</small></div></div>
      </div>
    </aside>
    <div class="main-wrapper">
      <header class="topbar">
        <div class="breadcrumbs">Workspace <span>/</span> <strong id="breadcrumb">Dashboard</strong></div>
        <div class="topbar-right"><span class="current-date" id="current-date"></span><span class="top-avatar">AF</span></div>
      </header>
      <main class="content">
        <div class="page-header">
          <div><div class="eyebrow" id="eyebrow">PANEL DE CONTROL</div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Todo lo que necesitás para gestionar tu flota.</p></div>
          <div class="header-actions" id="header-actions"></div>
        </div>
        <div id="alert" role="status" aria-live="polite"></div>
        <div id="view" aria-live="polite"><div class="initial-loader"><div class="spinner"></div> Cargando información...</div></div>
        <footer class="footer">AutoFlow <span>·</span> Gestión de alquileres <span>·</span> API Spring Boot</footer>
      </main>
    </div>
  </div>
  <div class="modal-backdrop hidden" id="modal-backdrop" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header"><div><div class="eyebrow">AUTO FLOW</div><h2 id="modal-title"></h2></div><button id="modal-x" class="icon-btn" aria-label="Cerrar ventana" type="button">✕</button></div>
      <form id="modal-form">
        <div class="modal-body" id="modal-body"></div>
        <p class="form-error hidden" id="form-error" role="alert"></p>
        <div class="modal-actions"><button id="modal-cancel" class="btn btn-outline" type="button">Cancelar</button><button id="modal-submit" class="btn btn-primary" type="submit">Guardar</button></div>
      </form>
    </div>
  </div>
</body>
</html>
